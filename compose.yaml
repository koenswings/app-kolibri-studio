x-app:
  name: kolibri-studio
  title: Kolibri Studio
  description: |
    Kolibri Studio is the tool used to organize learning resources and build channels for Kolibri, 
    an open-source platform specially designed to provide offline access to educational content.
  url: https://github.com/learningequality/studio
  category: education
  icon: icon.png
  author: Koen Swings  # Who created this compose file? (not the app ;-)
  # App version <major>.<minor> (idea#76); upstream: Studio v2024.12.03. No date suffix: the Engine reads
  # a date-shaped version (1.1-2024.12.03) as unversioned (Version.ts DATE_RE) and splits the app id wrongly.
  # 1.1 follows the existing git tag 1.0-2024.12.03; the release tag must be "1.1". Not released yet.
  version: "1.1"
  # updateApp fields (agent-app-dev docs/app-bundle-integrity.md). /healthz reads the database
  # (contentcuration views.health). healthTimeout is a placeholder until measured on a Pi.
  healthCheck:
    path: /healthz
  healthTimeout: 1800
  updatesFrom: []
  migrationNote: ""
  snapshotExclude: []
x-studio-environment:
  &studio-environment
    MPLBACKEND: ps
    SHELL: /bin/bash
    AWS_S3_ENDPOINT_URL: http://minio:9000
    DATA_DB_HOST: postgres
    # Production settings for an offline Pi (koenswings/service-kolibri-studio idea_settings.py): DEBUG off,
    # whitenoise for /static/, MinIO storage, console e-mail. Not dev_settings (devserver, DEBUG, dev_urls).
    DJANGO_SETTINGS_MODULE: contentcuration.idea_settings
    # k8s: Studio links stored files as same-origin /content/... URLs (models.generate_storage_url), which
    # idea_urls.py streams from MinIO. docker-compose mode links http://localhost:9000/..., which only a
    # browser on the Pi itself can open.
    RUN_MODE: k8s
    CELERY_TIMEZONE: America/Los_Angeles
    CELERY_REDIS_DB: 0
    CELERY_BROKER_ENDPOINT: redis
    CELERY_RESULT_BACKEND_ENDPOINT: redis
    CELERY_REDIS_PASSWORD: ""
services:
  studio-app:
    # Production image (koenswings/service-kolibri-studio Dockerfile): yarn run build + collectstatic in the
    # image build, gunicorn + whitenoise on 8080, docker/idea-entrypoint.py (waits for Postgres and MinIO,
    # bucket, migrate, loadconstants, one admin). Tag not built yet: build on an ARM64 Pi, then pin the
    # digest (release blockers, #2).
    image: koenswings/kolibri-studio:1.0-2024.12.03
    restart: no
    pull_policy: never
    depends_on:
      - minio
      - postgres
      - redis
    environment: *studio-environment
    # Entrypoint and command come from the image (python docker/idea-entrypoint.py, then gunicorn on
    # 0.0.0.0:8080). No webpack devserver, so no fixed 4000 port.
    ports:
      - "${port}:8080"
    # Primary service. /healthz needs the database (Studio views.health). python is in the image
    # (python:3.10-slim-bookworm base). start_period covers migrate on a first start; measure on a Pi.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s
    labels:
      x-app-version: "1.1"

  # Studio runs background work (publishing, channel copy/sync, exports) in celery. There is no worker yet:
  # see #2. A worker would use the studio-app image with command
  # ["celery", "--workdir", "contentcuration", "-A", "contentcuration", "worker", "-l", "info", "--concurrency=2"]
  # and no bind of the App folder.

  minio:
    #image: minio/minio:RELEASE.2020-06-22T03-12-50Z
    #image: minio/minio:RELEASE.2025-02-07T23-21-09Z-cpuv1
    image: minio/minio:RELEASE.2020-07-18T18-48-16Z-arm64
    restart: no
    pull_policy: never
    entrypoint: minio server /data
    environment:
      MINIO_ACCESS_KEY: development
      MINIO_SECRET_KEY: development
      MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:8080,http://127.0.0.1:8080'
    volumes:
      - ./data/minio:/data
    labels:
      x-app-version: "1.1"
  
  postgres:
    image: koenswings/kolibri-postgres:1.0-2024.12.03
    restart: no
    pull_policy: never
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: learningequality
      POSTGRES_PASSWORD: kolibri
      POSTGRES_DB: kolibri-studio
    volumes:
      - ./data/postgres:/var/lib/postgresql/data/pgdata
      - ./data/postgres-initdb:/docker-entrypoint-initdb.d
    labels:
      x-app-version: "1.1"
  
  redis:
    image: redis:6.0.9
    restart: no
    pull_policy: never
    labels:
      x-app-version: "1.1"
