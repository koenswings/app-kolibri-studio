x-app:
  name: kolibri-studio
  title: Kolibri Studio
  description: |
    Kolibri Studio is the tool used to organize learning resources and build channels for Kolibri, 
    an open-source platform specially designed to provide offline access to educational content.
  url: https://github.com/learningequality/studio
  category: education
  icon: icon.png
  author: Koen Swings  # Who created this compose file? (not the app ;-)
  # App version <major>.<minor> (idea#76); upstream: Studio v2024.12.03. No date suffix: the Engine reads
  # a date-shaped version (1.1-2024.12.03) as unversioned (Version.ts DATE_RE) and splits the app id wrongly.
  # 1.1 follows the existing git tag 1.0-2024.12.03; the release tag must be "1.1". Not released yet.
  version: "1.1"
  # updateApp fields (agent-app-dev docs/app-bundle-integrity.md). /healthz reads the database
  # (contentcuration views.health). healthTimeout is a placeholder until measured on a Pi.
  healthCheck:
    path: /healthz
  healthTimeout: 1800
  updatesFrom: []
  migrationNote: ""
  snapshotExclude: []
x-studio-environment:
  &studio-environment
    MPLBACKEND: ps
    SHELL: /bin/bash
    AWS_S3_ENDPOINT_URL: http://minio:9000
    DATA_DB_HOST: postgres
    DJANGO_SETTINGS_MODULE: contentcuration.dev_settings
    RUN_MODE: docker-compose
    CELERY_TIMEZONE: America/Los_Angeles
    CELERY_REDIS_DB: 0
    CELERY_BROKER_ENDPOINT: redis
    CELERY_RESULT_BACKEND_ENDPOINT: redis
    CELERY_REDIS_PASSWORD: ""
    PROBER_STUDIO_BASE_URL: http://studio-app:8080/{path}
x-studio-worker:
  &studio-worker
    image: koenswings/kolibri-studio
    restart: no
    pull_policy: never
    depends_on:
      - minio
      - postgres
      - redis
    volumes:
      - .:/src
    environment: *studio-environment
services:
  studio-app:
    #<<: *studio-worker
    #image: koenswings/kolibri-studio:1.01-2024.12.03
    image: koenswings/kolibri-studio:latest_dev
    restart: no
    pull_policy: never
    depends_on:
      - minio
      - postgres
      - redis
    environment: *studio-environment
    entrypoint: python docker/entrypoint.py
    # command: yarn run runserver  # Use this when building during image construction
    command: yarn run devserver
    #OBSOLETE - This will overwrite the /src folder
    #volumes:
    #    - ./data:/src
    ports:
      - "${port}:8080"
      # Fixed on purpose: the devserver (yarn run devserver = webpack serve, Studio webpack.config.js) serves
      # the JS bundles on 4000 and the pages load them from http://127.0.0.1:4000/dist/ (dev publicPath), so
      # it can be neither dropped nor remapped while studio-app runs the devserver. A production build
      # (yarn run build + runserver) removes it; release blocker, see the backlog issue.
      - "4000:4000"
    # Primary service. Django runserver on 8080; /healthz needs the database (idea#403 PR #1, not Pi-tested).
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=8)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 900s
    labels:
      x-app-version: "1.1"
  
  #celery-worker:
  #  <<: *studio-worker
  #  command: make prodceleryworkers
  
  minio:
    #image: minio/minio:RELEASE.2020-06-22T03-12-50Z
    #image: minio/minio:RELEASE.2025-02-07T23-21-09Z-cpuv1
    image: minio/minio:RELEASE.2020-07-18T18-48-16Z-arm64
    restart: no
    pull_policy: never
    entrypoint: minio server /data
    environment:
      MINIO_ACCESS_KEY: development
      MINIO_SECRET_KEY: development
      MINIO_API_CORS_ALLOW_ORIGIN: 'http://localhost:8080,http://127.0.0.1:8080'
    volumes:
      - ./data/minio:/data
    labels:
      x-app-version: "1.1"
  
  postgres:
    image: koenswings/kolibri-postgres:1.0-2024.12.03
    restart: no
    pull_policy: never
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: learningequality
      POSTGRES_PASSWORD: kolibri
      POSTGRES_DB: kolibri-studio
    volumes:
      - ./data/postgres:/var/lib/postgresql/data/pgdata
      - ./data/postgres-initdb:/docker-entrypoint-initdb.d
    labels:
      x-app-version: "1.1"
  
  redis:
    image: redis:6.0.9
    restart: no
    pull_policy: never
    labels:
      x-app-version: "1.1"
