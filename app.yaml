app: kolibri-studio
idea_app_version: "1.0"

compatibility:
  engine_min: "0.9.0"
  engine_tested: "unknown"

services:
  - name: studio-app
    # Production image (yarn run build + collectstatic in the build, gunicorn + whitenoise), built on an
    # ARM64 Pi from koenswings/service-kolibri-studio (Dockerfile). Not built or published yet (#2).
    build: custom
    source: https://github.com/koenswings/service-kolibri-studio
    dockerfile: Dockerfile
    image: koenswings/kolibri-studio
    current_version: "unknown"
    monitors:
      - kind: github-release
        repo: learningequality/studio
        notes: "Monitor GitHub releases for new Kolibri Studio versions."

  - name: postgres
    # Built (not pulled; compose pull_policy: never) from koenswings/service-kolibri-postgres, a copy of
    # Studio v2024.12.03 docker/Dockerfile.postgres.dev: FROM postgres:$PG_MAJOR with ARG PG_MAJOR=12
    # (Studio's docker-compose passes no build args), plus pgvector. Date retag: keep upstream_tag equal
    # to the Postgres major the image is built from, on every rebuild (idea#403 check-compose --base-ref).
    build: custom
    source: https://github.com/koenswings/service-kolibri-postgres
    upstream: postgres
    upstream_tag: "12"
    image: koenswings/kolibri-postgres
    current_version: "1.0-2024.12.03"
    monitors:
      - kind: dockerhub
        repo: library/postgres
        tag_pattern: "^\\d+$"

  - name: redis
    # compose runs the official redis:6.0.9 as is (Studio v2024.12.03 docker-compose.yml; manifest list has
    # linux/arm64/v8). Cache and celery broker only, no volume. A new Redis series (6.0 -> 6.2/7) is a
    # stateful-image move for check-compose --base-ref, so the monitor stays on 6.0.x.
    build: direct
    upstream: redis
    upstream_tag: "6.0.9"
    image: redis
    current_version: "6.0.9"
    monitors:
      - kind: dockerhub
        repo: library/redis
        tag_pattern: "^6\\.0\\.\\d+$"

  - name: minio
    build: retag
    upstream: minio/minio
    upstream_tag: "latest"
    image: koenswings/kolibri-studio-minio
    current_version: "unknown"
    monitors:
      - kind: dockerhub
        repo: minio/minio
        tag_pattern: "^RELEASE\\.\\d{4}-\\d{2}-\\d{2}"

notes: >
  Kolibri Studio is complex (4 services; celery worker not yet added). studio-app
  now runs a production build (idea_settings, gunicorn + whitenoise); the
  remaining release blockers are in koenswings/app-kolibri-studio#2.
